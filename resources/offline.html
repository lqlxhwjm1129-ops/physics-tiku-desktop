<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>物理题库 · 需要联网</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, Arial, sans-serif;
        background: linear-gradient(160deg, #1565c0 0%, #0d47a1 100%);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 520px;
        width: 100%;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 16px;
        padding: 32px;
        text-align: center;
        backdrop-filter: blur(6px);
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { line-height: 1.7; color: rgba(255, 255, 255, 0.86); font-size: 14px; }
      .url { word-break: break-all; font-family: Consolas, monospace; font-size: 12px; color: rgba(255,255,255,0.7); }
      button {
        margin-top: 20px;
        padding: 12px 28px;
        border: none;
        border-radius: 10px;
        background: #fff;
        color: #0d47a1;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #e3f2fd; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>需要联网</h1>
      <p>物理题库桌面版通过云端服务提供题目与账号数据，请确认网络连接后重试。</p>
      <p class="url" id="target"></p>
      <button id="retry" type="button">重新加载</button>
    </div>
    <script>
      // 读取主进程传入的查询参数（目标地址 / 错误码），供重试使用
      const params = new URLSearchParams(location.search)
      const target = params.get('url') || 'https://physics-tiku-42021.app.workbuddy.host/'
      const code = params.get('code')
      const desc = params.get('desc')
      document.getElementById('target').textContent =
        target + (code ? '（错误 ' + code + (desc ? ' · ' + desc : '') + '）' : '')
      document.getElementById('retry').addEventListener('click', () => {
        location.href = target
      })
    </script>
  </body>
</html>
